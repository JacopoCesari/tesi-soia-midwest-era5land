# Paths are relative to the parent of this configs directory (output/).
paths:
  repository_root: ..
  external: ../data/raw/usda_nass
  target: ../data/target/soybean_yield_1951_2025.csv
  counties: ../data/auxiliary/counties.csv
  acreage: ../data/auxiliary/acres_harvested_1951_2025.csv
  provenance: ../data/auxiliary/panel_provenance.json
  raw: ../data/raw/era5_land
  preflight: ../data/raw/era5_land/preflight
  supplied_preflight: ../data/raw/era5_land/supplied_preflight
  output: ../data/weather/daily_counties
  preflight_output: ../data/weather/preflight
  weights: ../data/auxiliary/spatial_weights.csv
  supplied_weights: ../data/auxiliary/spatial_weights_479_counties.parquet
  historical_manifest: ../data/raw/era5_land/manifest.csv
  migration_map: ../data/raw/usda_nass/file_migration.json
  quality_reports: ../work/reports/experiments/quality_control
  feature_manifest: configs/feature_manifest_37.yaml
  arco_cache: ../data/raw/era5_land/arco_cache
  arco_inventory: ../data/raw/era5_land/arco_inventory.json
arco:
  base_url: "https://arco.datastores.ecmwf.int"
  store_type: "geoChunked"
  timeout_seconds: 60
  max_retries: 3
  stores:
    sfc-2m-temperature: "cadl-arco-geo-007"
    sfc-soil-temperature: "cadl-arco-geo-006"
    sfc-soil-water: "cadl-arco-geo-005"
    sfc-radiation-heat: "cadl-arco-geo-010"
    sfc-snow: "cadl-arco-geo-030"
    sfc-wind: "cadl-arco-geo-008"
    sfc-pressure-precipitation: "cadl-arco-geo-009"
    sfc-skin-temperature: "cadl-arco-geo-043"
primary_period:
  start_year: 1951
  end_year: 2025
# Keep 1950 weather for the October 1950-October 1951 crop campaign.
weather_period:
  start_year: 1950
  end_year: 2025
expected_counties: 135
supplied_counties: 479
preflight_years: [1950, 2025]
