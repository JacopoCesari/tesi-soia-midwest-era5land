[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soybean-yield-forecasting"
version = "0.1.0"
description = "Weather-only county-level soybean yield forecasting research"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Jacopo Cesari" }
]
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.16.1",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.0",
    "cdsapi>=0.7.0",
    "netCDF4>=1.7.0",
    "xarray>=2024.0.0",
    "zarr>=2.18.0,<3.0.0",
    "fsspec>=2024.0.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
geospatial = ["geopandas>=1.1.4", "shapely>=2.1.2"]
machine_learning = ["scikit-learn>=1.5.0", "xgboost>=2.1.0", "lightgbm>=4.5.0"]
deep_learning = ["torch>=2.4.0"]
development = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../work/tests"]
markers = [
    "network: tests requiring external network access to ARCO or CDS (deselected by default)",
]
addopts = "-m 'not network'"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
